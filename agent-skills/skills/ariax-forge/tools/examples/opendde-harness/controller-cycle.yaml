  recycling_cycles: 1
  diffusion_steps: 20
  diffusion_samples: 1
  use_msa: false
  enable_msa_search: false
  use_templates: false
  need_atom_confidence: true
  enable_batch_inference: true
  subprocess_timeout_seconds: 7200
