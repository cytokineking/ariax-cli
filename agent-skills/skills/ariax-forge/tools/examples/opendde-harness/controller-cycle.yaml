# Authored source fixture, not a completed campaign or approved model selection.
# CRLF2/VHH chains and CDR ranges are from pinned upstream crlf2_quickstart.yaml.
seed: 42
llm:
  model_name: openai-codex/gpt-6.1-sol
  max_tokens: 2048
compute:
  placement:
    fold: [0]
    esm: 0
    mpnn: 0
    cp_degree: 1
design:
  type: antibody
  n_cycles: 1
  num_sequences: 1
  num_mutations: 1-10
  reflection_interval: 1
  cycle_retry_limit: 0
  skip_failed_cycles: false
  population_size: 20
  optimization_metric: loss
  enable_quality_check: true
  quality_check_threshold: 0.7
  parent_selection_strategy: fitness
  router_selection_strategy: agent
  router_skill_probabilities:
